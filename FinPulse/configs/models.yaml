# Model Benchmark, Imbalance and Tuning Specifications
models:
  logistic_regression:
    class_name: "LogisticRegression"
    params:
      C: 1.0
      penalty: "l2"
      solver: "lbfgs"
      max_iter: 1000
      class_weight: "balanced"
      random_state: 42

  random_forest:
    class_name: "RandomForestClassifier"
    params:
      n_estimators: 200
      max_depth: 12
      min_samples_split: 10
      class_weight: "balanced"
      n_jobs: -1
      random_state: 42

  xgboost:
    class_name: "XGBClassifier"
    params:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: "hist"
      eval_metric: "logloss"
      random_state: 42

  lightgbm:
    class_name: "LGBMClassifier"
    params:
      n_estimators: 300
      num_leaves: 63
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      verbose: -1

  catboost:
    class_name: "CatBoostClassifier"
    params:
      iterations: 500
      depth: 6
      learning_rate: 0.05
      auto_class_weights: "Balanced"
      verbose: 0
      random_seed: 42

  isolation_forest:
    class_name: "IsolationForest"
    params:
      n_estimators: 150
      max_samples: 256
      contamination: 0.01
      random_state: 42
      n_jobs: -1

imbalance_strategies:
  primary: "class_weighted"
  experimental:
    - "random_undersample"
    - "smote"
    - "smote_tomek"

optuna_tuning:
  n_trials: 35
  timeout_seconds: 1800
  metric: "pr_auc"
  direction: "maximize"

calibration:
  methods:
    - "platt"
    - "isotonic"
  validation_metric: "brier_score"
