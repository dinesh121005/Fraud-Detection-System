# Optuna Hyperparameter Optimization Configuration
tuning:
  n_trials: 35
  timeout_seconds: 1800
  metric: "pr_auc"
  direction: "maximize"
  random_seed: 42
  primary_dataset: "sparkov"  # Default tuning dataset for credit fraud signals
  multi_dataset: true

  # Search space definitions for candidate models
  search_spaces:
    lightgbm:
      learning_rate:
        type: "float"
        low: 0.01
        high: 0.15
        log: true
      num_leaves:
        type: "int"
        low: 15
        high: 127
      max_depth:
        type: "int"
        low: 3
        high: 12
      min_child_samples:
        type: "int"
        low: 10
        high: 100
      subsample:
        type: "float"
        low: 0.6
        high: 1.0
      colsample_bytree:
        type: "float"
        low: 0.6
        high: 1.0
      reg_alpha:
        type: "float"
        low: 0.0
        high: 5.0
      reg_lambda:
        type: "float"
        low: 0.0
        high: 10.0

    xgboost:
      learning_rate:
        type: "float"
        low: 0.01
        high: 0.15
        log: true
      max_depth:
        type: "int"
        low: 3
        high: 10
      subsample:
        type: "float"
        low: 0.6
        high: 1.0
      colsample_bytree:
        type: "float"
        low: 0.6
        high: 1.0
      gamma:
        type: "float"
        low: 0.0
        high: 5.0
      reg_alpha:
        type: "float"
        low: 0.0
        high: 5.0
      reg_lambda:
        type: "float"
        low: 0.0
        high: 10.0

    catboost:
      learning_rate:
        type: "float"
        low: 0.01
        high: 0.15
        log: true
      depth:
        type: "int"
        low: 4
        high: 8
      l2_leaf_reg:
        type: "float"
        low: 1.0
        high: 10.0

    random_forest:
      n_estimators:
        type: "int"
        low: 50
        high: 250
      max_depth:
        type: "int"
        low: 5
        high: 20
      min_samples_split:
        type: "int"
        low: 2
        high: 20

    logistic_regression:
      C:
        type: "float"
        low: 0.001
        high: 100.0
        log: true
