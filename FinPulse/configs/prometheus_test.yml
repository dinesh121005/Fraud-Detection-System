# FinPulse R6.1 — Prometheus Monitoring Configuration (Test & Live Scrape)
global:
  scrape_interval: 1s
  evaluation_interval: 1s
  scrape_timeout: 1s

scrape_configs:
  - job_name: 'finpulse-api'
    scrape_interval: 1s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          environment: 'test-validation'
          app: 'finpulse'
          system: 'fraud-detection'
