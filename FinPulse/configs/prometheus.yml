# FinPulse R6.1 — Prometheus Monitoring Configuration
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: 'finpulse-api'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['finpulse-api:8000', 'host.docker.internal:8000', 'localhost:8000']
        labels:
          environment: 'production'
          app: 'finpulse'
          system: 'fraud-detection'
