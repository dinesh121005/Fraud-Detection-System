# FinPulse ML Subsystem Base Configuration
system:
  name: "FinPulse AI - Fraud Intelligence Operations"
  version: "2.0.0"
  random_seed: 42
  environment: "development"

paths:
  root_dir: "d:/Fraud-Detection-System/FinPulse"
  data_dir: "d:/Fraud-Detection-System/FinPulse/data"
  processed_data_dir: "d:/Fraud-Detection-System/FinPulse/data/processed"
  models_dir: "d:/Fraud-Detection-System/FinPulse/models"
  baseline_models_dir: "d:/Fraud-Detection-System/FinPulse/models/baseline"
  artifacts_dir: "d:/Fraud-Detection-System/FinPulse/models/artifacts"
  registry_dir: "d:/Fraud-Detection-System/FinPulse/models/registry"
  reports_dir: "d:/Fraud-Detection-System/FinPulse/reports"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  save_to_file: true
  log_file: "d:/Fraud-Detection-System/FinPulse/reports/finpulse_execution.log"
